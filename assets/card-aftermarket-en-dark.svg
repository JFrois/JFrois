<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-labelledby="t d">
<title id="t">Aftermarket Analysis</title><desc id="d">Cross-references OEM customer data and instantly answers where parts are and which aftermarket opportunities exist. Corporate app, VOSS Automotive.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7392E0"/><stop offset="1" stop-color="#73C2A9"/></linearGradient>
<linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7392E0"/><stop offset="1" stop-color="#73C2A9"/></linearGradient>
