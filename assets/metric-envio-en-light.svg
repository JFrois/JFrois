<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-labelledby="t d">
<title id="t">NEW CASES DISPATCH: 100 → 500 /day</title><desc id="d">3x to 5x the manual volume (~2 h for 100) now: one click, runs on its own</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f5fb8"/><stop offset="1" stop-color="#1d8a6a"/></linearGradient>
<linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f5fb8"/><stop offset="1" stop-color="#1d8a6a"/></linearGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#3f5fb8" opacity=".16"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#3f5fb8" stop-opacity=".13"/><stop offset="1" stop-color="#3f5fb8" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2"><stop offset="0" stop-color="#1d8a6a" stop-opacity=".12"/><stop offset="1" stop-color="#1d8a6a" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:5;opacity:.9}100%{r:14;opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
.cur{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-out infinite}
.flow{animation:flow 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){.cur,.pulse,.flow{animation:none}}
</style>
<rect x=".75" y=".75" width="558.5" height="168.5" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><rect x=".75" y=".75" width="558.5" height="168.5" rx="14" fill="url(#dots)"/><rect x="1.5" y="28" width="4" height="40" rx="2" fill="url(#gv)"/><text x="26" y="40" font-size="13" letter-spacing="1.5" fill="#0b7285">NEW CASES DISPATCH</text><text x="24" y="102" font-size="44" font-weight="700" fill="url(#g)">100 → 500 /day</text><text x="26" y="132" font-size="13.5" fill="#57606a">3x to 5x the manual volume (~2 h for 100)</text><text x="26" y="152" font-size="13.5" fill="#57606a">now: one click, runs on its own</text>
</svg>
