<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-labelledby="t d">
<title id="t">ORDER PROCESSOR: 6–12 h → 20 s</title><desc id="d">active user time (~1,000-PDF cycle) ran 8,000 orders in ~6 h, unattended</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7392E0"/><stop offset="1" stop-color="#73C2A9"/></linearGradient>
<linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7392E0"/><stop offset="1" stop-color="#73C2A9"/></linearGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#7392E0" opacity=".18"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#7392E0" stop-opacity=".30"/><stop offset="1" stop-color="#7392E0" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2"><stop offset="0" stop-color="#73C2A9" stop-opacity=".22"/><stop offset="1" stop-color="#73C2A9" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:5;opacity:.9}100%{r:14;opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
.cur{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-out infinite}
.flow{animation:flow 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){.cur,.pulse,.flow{animation:none}}
</style>
<rect x=".75" y=".75" width="558.5" height="168.5" rx="14" fill="#0d1117" stroke="#1f2a44" stroke-width="1.5"/><rect x=".75" y=".75" width="558.5" height="168.5" rx="14" fill="url(#dots)"/><rect x="1.5" y="28" width="4" height="40" rx="2" fill="url(#gv)"/><text x="26" y="40" font-size="13" letter-spacing="1.5" fill="#4DD0E1">ORDER PROCESSOR</text><text x="24" y="102" font-size="44" font-weight="700" fill="url(#g)">6–12 h → 20 s</text><text x="26" y="132" font-size="13.5" fill="#8b9bb4">active user time (~1,000-PDF cycle)</text><text x="26" y="152" font-size="13.5" fill="#8b9bb4">ran 8,000 orders in ~6 h, unattended</text>
</svg>
